server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Live game updates (Server-Sent Events): pass each event through
    # immediately and allow the connection to stay open.
    location ~ ^/api/games/[^/]+/events$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Forward API calls to the Go backend. "backend" is the service name in
    # both docker-compose.yml and the Kubernetes manifests.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
